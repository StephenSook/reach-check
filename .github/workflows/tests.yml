name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every module on this interpreter
        run: python3 -m compileall -q play/resources tests
      - name: Run the extractor tests
        run: python3 tests/test_reach.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff==0.14.2
      - name: Lint
        run: ruff check play/resources tests --target-version py39
      - name: Format check
        run: ruff format --check play/resources tests

  guarantees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The extractor must never execute or import what it reads
        run: |
          if grep -nE '\b(exec|eval|__import__|importlib\.import_module)\(' play/resources/reach_analysis.py; then
            echo "FAIL: the extractor must not execute or import analysed code"
            exit 1
          fi
          echo "ok: no execution primitives in the extractor"
      - name: the extractor must import only the standard library
        run: |
          python3 - <<'CHECK'
          import ast, sys
          ALLOWED = {
              "ast", "hashlib", "importlib", "json", "os", "pathlib", "platform",
              "re", "shlex", "shutil", "subprocess", "sys", "sysconfig",
          }
          bad = []
          for path in ("play/resources/reach_analysis.py", "play/resources/rote_verdict.py",
                       "play/resources/host_facts.py"):
              tree = ast.parse(open(path).read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for a in node.names:
                          if a.name.split(".")[0] not in ALLOWED:
                              bad.append((path, a.name))
                  elif isinstance(node, ast.ImportFrom):
                      if node.module and node.module.split(".")[0] not in ALLOWED:
                          bad.append((path, node.module))
          if bad:
              print("FAIL: non-standard-library import:", bad)
              sys.exit(1)
          print("ok: standard library only, checked by parsing not by grep")
          CHECK
